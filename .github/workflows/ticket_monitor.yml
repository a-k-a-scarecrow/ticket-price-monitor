name: Ticket Price Monitor

on:
  schedule:
    - cron: "0 * * * *"  # every hour, on the hour (UTC)
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated state.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price scan
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: src
        run: python -m ticket_monitor.main

      - name: Commit updated state, if any
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "ticket-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update tracked prices [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
